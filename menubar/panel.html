<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>clint</title>
<style>
:root{--latar:#1A1E25;--kartu:#232832;--teks:#E8EBF0;--abu:#98A1AE;--garis:rgba(255,255,255,0.07);
  --biru:#6AA8FF;--merah:#E55B5B;--oranye:#F0954A;--kuning:#D9A93A;--hijau:#3DBB7E;--redup:#6B7383}
*{box-sizing:border-box}
html,body{margin:0;background:var(--latar);color:var(--teks);
  font:13px/1.35 -apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',sans-serif;
  -webkit-user-select:none;user-select:none;cursor:default}
#panel{width:340px;padding:8px;display:flex;flex-direction:column;gap:6px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;text-align:left;cursor:default}
.kepala{display:flex;align-items:baseline;justify-content:space-between;padding:4px 6px 2px}
.kepala b{font-size:15px}.kepala span{font-size:12px;color:var(--abu)}
.kartu{display:flex;flex-direction:column;gap:8px;padding:10px;border-radius:9px;background:var(--kartu);width:100%}
.kartu:hover,.baris:hover,.ubin:hover{background:#2C3340}
.atas{display:flex;align-items:center;gap:8px}
.atas b{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kecil{font-size:12px;color:var(--abu)}
.lencana{font-size:11px;color:var(--abu);border:1px solid rgba(255,255,255,0.14);border-radius:4px;padding:0 5px}
.bilah{display:grid;gap:4px}
.bilah span{height:4px;border-radius:2px;background:rgba(255,255,255,0.12)}
.bilah .lewat{background:var(--biru)}.bilah .kini{background:var(--biru);opacity:.45}
.tahap{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;font-size:10px;color:var(--abu)}
.tahap .kini{color:var(--teks);font-weight:600}
.baris{display:flex;align-items:center;gap:9px;padding:6px;border-radius:6px;width:100%}
.baris .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.titik{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.p{font-size:12px;color:var(--abu);width:70px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.judul-seksi{font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--abu);padding:4px 6px 0}
.garis{height:1px;background:var(--garis)}
.kotak{display:flex;flex-direction:column;gap:2px;padding:8px 10px;border-radius:9px}
.kotak b{font-size:14px}.kotak span{font-size:12px;color:#C9CED6}
.selesai{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:9px;background:rgba(61,187,126,0.12);width:100%}
.selesai:hover{background:rgba(61,187,126,0.2)}
.ubin-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.ubin{display:flex;flex-direction:column;align-items:center;gap:5px;padding:9px 4px;border-radius:8px;background:var(--kartu);font-size:11px}
.sub{display:flex;flex-direction:column;margin:0 0 4px 12px;padding-left:8px;border-left:1px solid var(--garis)}
.panah{transition:transform .15s}.buka .panah{transform:rotate(90deg)}
.nilai{font-size:12px;color:var(--abu)}.nilai.on{color:var(--hijau)}
.agen{display:flex;flex-direction:column;gap:6px;padding-top:8px;border-top:1px solid var(--garis)}
.agen-baris{display:flex;gap:9px;align-items:flex-start}.agen-baris .titik{margin-top:5px}
.agen-isi{display:flex;flex-direction:column;gap:1px;min-width:0}
.agen-isi .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.baris.vs{padding:6px 0;color:var(--biru)}.baris.vs:hover{background:none;text-decoration:underline}
</style>
</head>
<body>
<div id="panel"></div>
<script>
const TAHAP = ['worktree', 'kode', 'tinjau', 'test', 'MR'];
const WARNA = {gagal: 'var(--merah)', kerjakan: 'var(--oranye)', tadi: 'var(--hijau)',
  menunggu: 'var(--kuning)', diam: 'var(--redup)'};
const IKON = {
  laporan: '<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/>',
  cek: '<path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/>',
  mic: '<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/>',
  centang: '<path d="M5 12l5 5L20 7"/>',
  panah: '<path d="M9 6l6 6-6 6"/>',
};
const ikon = (n, warna = '#C3C9D2', ukuran = 16) =>
  `<svg width="${ukuran}" height="${ukuran}" viewBox="0 0 24 24" fill="none" stroke="${warna}" stroke-width="2" ` +
  `stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="${n === 'panah' ? 'panah' : ''}">${IKON[n]}</svg>`;
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'})[c]);
const terbuka = new Set();
let terakhir = null;

function kirim(pesan) { window.webkit?.messageHandlers?.clint?.postMessage(pesan); }
function aksi(...args) { kirim({aksi: args}); }

function bilah(jumlah, langkah) {
  const isi = Array.from({length: jumlah}, (_, i) =>
    `<span class="${i < langkah ? 'lewat' : i === langkah ? 'kini' : ''}"></span>`).join('');
  return `<div class="bilah" style="grid-template-columns:repeat(${jumlah},minmax(0,1fr))">${isi}</div>`;
}

function kartuCek(k) {
  const m = /(\d+)\s*\/\s*(\d+)/.exec(k.tahap || '');
  return `<div class="kartu"><div class="atas"><b>${esc(k.judul)}</b><span class="kecil">sejak ${esc(k.mulai)}</span></div>
    ${m ? bilah(+m[2], +m[1] - 1) : ''}${k.tahap ? `<span class="kecil">${esc(k.tahap)}</span>` : ''}</div>`;
}

function kartuSesi(s, i) {
  const tahap = s.langkah === null ? '' : bilah(5, s.langkah) + `<div class="tahap">${TAHAP.map((t, j) =>
    `<span class="${j === s.langkah ? 'kini' : ''}">${t}</span>`).join('')}</div>`;
  const kaki = [s.proyek, s.agents.length && `${s.agents.length} agent jalan`].filter(Boolean).join(' · ');
  const buka = terbuka.has('s' + i);
  const utama = s.utama ? `<div class="agen-baris"><span class="titik" style="background:var(--hijau)"></span>
    <div class="agen-isi"><span class="t" style="font-weight:600">Sesi utama</span>
    <span class="kecil">${[s.utama.model, s.utama.token && s.utama.token + ' token konteks'].filter(Boolean).map(esc).join(' · ')}</span></div></div>` : '';
  const rincian = !buka ? '' : `<div class="agen">
    <span class="kecil">${s.agents.length ? `${s.agents.length} agent jalan` : 'Tidak ada agent yang jalan'}</span>
    ${utama}${s.agents.map((a) =>
    `<div class="agen-baris" style="padding-left:14px"><span class="titik" style="background:var(--hijau)"></span><div class="agen-isi">
      <span class="t">${esc(a.deskripsi || a.tipe)}</span>
      <span class="kecil">${[a.tipe, a.lama, a.token && a.token + ' token'].filter(Boolean).map(esc).join(' · ')}</span></div></div>`).join('')}
    <button class="baris vs" data-sesi="${i}"><span class="t">Buka di VS Code</span></button></div>`;
  return `<div class="kartu ${buka ? 'buka' : ''}" data-buka="s${i}"><div class="atas"><b>${esc(s.nama)}</b>
    ${s.pr ? `<span class="lencana">${esc(s.pr)}</span>` : ''}<span class="kecil">${esc(s.ekor)}</span>${ikon('panah', '#98A1AE', 12)}</div>
    ${tahap}<span class="kecil">${esc(kaki)}</span>
    ${s.utama && s.utama.besar ? `<span class="kecil" style="color:#E6C470">Konteks ${esc(s.utama.token)} token: tugas berikutnya lebih hemat di sesi baru</span>` : ''}${rincian}</div>`;
}

function barisSesi(s, i) {
  if (s.status === 'selesai') {
    return `<button class="selesai" data-sesi="${i}">${ikon('centang', 'var(--hijau)', 14)}
      <span style="flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(s.proyek)} · ${esc(s.nama)}</span>
      <span class="kecil">${esc(s.ekor)}</span></button>`;
  }
  const ekor = s.status === 'menunggu' ? `<span class="kecil" style="color:#E6C470">${esc(s.ekor)}</span>`
    : `<span class="kecil">${esc(s.ekor)}</span>`;
  return `<button class="baris" data-sesi="${i}"><span class="titik" style="background:${WARNA[s.status]}"></span>
    <span class="t">${esc(s.proyek)} · ${esc(s.nama)}</span>${ekor}</button>`;
}

function kotakStatus(d) {
  if (d.status === 'gagal') return `<div class="kotak" style="background:rgba(229,91,91,0.14)"><b>Ada yang gagal</b><span>${esc(d.kepala.gagal)}</span></div>`;
  if (d.status === 'aman') return `<div class="kotak" style="background:rgba(61,187,126,0.12)"><b>Semua aman</b><span>Tidak ada yang perlu ditindaklanjuti.</span></div>`;
  if (d.status === 'kosong') return `<div class="kotak" style="background:var(--kartu)"><b>Belum ada laporan</b><span style="color:var(--abu)">Jalankan Cek semua project</span></div>`;
  return '';
}

function render(d) {
  terakhir = d;
  const aktif = d.sesi.map((s, i) => [s, i]).filter(([s]) => s.status === 'bekerja' || s.status === 'latar');
  const lain = d.sesi.map((s, i) => [s, i]).filter(([s]) => s.status !== 'bekerja' && s.status !== 'latar');
  const p = d.pengaturan;
  const h = [];
  h.push(`<div class="kepala"><b>${esc(d.kepala.judul)}</b><span>${esc(d.status === 'kosong' ? '' : d.kepala.sub)}</span></div>`);
  h.push(kotakStatus(d));
  d.cek.forEach((k) => h.push(kartuCek(k)));
  aktif.forEach(([s, i]) => h.push(kartuSesi(s, i)));
  if (lain.length) h.push(`<div style="display:flex;flex-direction:column">${lain.map(([s, i]) => barisSesi(s, i)).join('')}</div>`);
  if (d.urgen.length) {
    h.push('<div class="garis"></div><span class="judul-seksi">PERLU DIKERJAKAN</span><div style="display:flex;flex-direction:column">');
    d.urgen.forEach((u) => h.push(`<button class="baris" data-aksi="laporan"><span class="titik" style="background:${WARNA[u.jenis]}"></span>
      <span class="p">${esc(u.proyek)}</span><span class="t">${u.jenis === 'tadi' ? '✓ ' : ''}${esc(u.teks)}</span></button>`));
    h.push('</div>');
  }
  h.push('<div class="garis"></div><div class="ubin-grid">');
  h.push(`<button class="ubin" data-aksi="laporan">${ikon('laporan')}<span>Laporan</span></button>`);
  h.push(`<button class="ubin" data-aksi="cek-semua" data-segar="1">${ikon('cek')}<span>Cek semua</span></button>`);
  h.push(`<button class="ubin" data-aksi="halo">${ikon('mic')}<span>Halo Clint</span></button></div>`);
  h.push('<div style="display:flex;flex-direction:column">');
  h.push(`<button class="baris ${terbuka.has('cek') ? 'buka' : ''}" data-buka="cek"><span class="t">Cek project</span>${ikon('panah', '#98A1AE', 12)}</button>`);
  if (terbuka.has('cek')) {
    h.push(`<div class="sub">${d.proyek_aktif.map((x, i) =>
      `<button class="baris" data-proyek="${i}"><span class="t">${esc(x.nama)}</span></button>`).join('')}</div>`);
  }
  h.push(`<button class="baris ${terbuka.has('atur') ? 'buka' : ''}" data-buka="atur"><span class="t">Pengaturan</span>${ikon('panah', '#98A1AE', 12)}</button>`);
  if (terbuka.has('atur')) {
    h.push(`<div class="sub">
      <button class="baris" data-aksi="suara" data-tetap="1"><span class="t">Suara</span><span class="nilai ${p.suara ? 'on' : ''}">${p.suara ? 'aktif' : 'mati'}</span></button>
      <button class="baris" data-aksi="${p.sapaan ? 'sapaan-mati' : 'sapaan-nyala'}" data-tetap="1"><span class="t">Sapaan pagi</span><span class="nilai ${p.sapaan ? 'on' : ''}">${p.sapaan ? `${esc(p.sapaan_jam)} Sen–Jum` : 'mati'}</span></button>
      <button class="baris" data-aksi="${p.bisu ? 'bunyikan' : 'bisu'}" data-tetap="1"><span class="t">${p.bisu ? 'Nyalakan kabar lagi' : 'Bisukan sampai besok'}</span></button>
      <button class="baris" data-aksi="bersihkan" data-tetap="1"><span class="t">Bersihkan menu (hal menunggu &amp; klaim kerja)</span></button></div>`);
  }
  h.push('</div>');
  const panel = document.getElementById('panel');
  panel.innerHTML = h.join('');
  kirim({tinggi: Math.ceil(panel.getBoundingClientRect().height)});
}

document.addEventListener('click', (e) => {
  const el = e.target.closest('button') || e.target.closest('[data-buka]');
  if (!el || !terakhir) return;
  if (el.dataset.buka) {
    const k = el.dataset.buka;
    if (terbuka.has(k)) terbuka.delete(k);
    else {                       // kartu sesi: hanya satu yang terbuka supaya panel tidak penuh
      if (k[0] === 's') [...terbuka].filter((x) => x[0] === 's').forEach((x) => terbuka.delete(x));
      terbuka.add(k);
    }
    render(terakhir);
  } else if (el.dataset.sesi) {
    aksi('vscode', terakhir.sesi[+el.dataset.sesi].buka);
  } else if (el.dataset.proyek) {
    aksi('cek', terakhir.proyek_aktif[+el.dataset.proyek].dir);
  } else if (el.dataset.aksi) {
    kirim({aksi: [el.dataset.aksi], tetap: !!el.dataset.tetap});
  }
});
</script>
</body>
</html>
